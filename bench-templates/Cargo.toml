[package]
name = "ark-pcs-bench-templates"
version = "0.6.0"
authors = ["arkworks contributors"]
edition = "2018"
rust-version = "1.97"
license = "MIT/Apache-2.0"
repository = "https://github.com/arkworks-rs/poly-commit"
categories = ["cryptography"]
publish = false

[dependencies]
ark-poly-commit = { path = "..", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false, features = ["derive"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-poly = { version = "0.6.0", default-features = false }
ark-crypto-primitives = { version = "0.6.0", default-features = false, features = ["sponge", "merkle_tree"] }
ark-std = { version = "0.6.0", default-features = false }
rand_chacha = { version = "0.3.0", default-features = false }
criterion = { version = "0.5", default-features = false, optional = true }
paste = { version = "1.0", optional = true }

[dev-dependencies]
ark-bn254 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-ed-on-bls12-381 = { version = "0.6.0", default-features = false }
blake2 = { version = "0.10", default-features = false }

[features]
# The criterion benchmark harness. Off by default so that the ark-poly-commit
# test build, which uses only the hashers, does not link criterion.
bench = ["dep:criterion", "dep:paste"]

[[bench]]
name = "ipa_times"
path = "benches/ipa_times.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "brakedown_times"
path = "benches/brakedown_ml_times.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "ligero_ml_times"
path = "benches/ligero_ml_times.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "hyrax_times"
path = "benches/hyrax_times.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "size"
path = "benches/size.rs"
harness = false
required-features = ["bench"]
