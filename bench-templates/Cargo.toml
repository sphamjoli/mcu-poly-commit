[package]
name = "ark-pcs-bench-templates"
version = "0.6.0"
authors = ["arkworks contributors"]
edition = "2018"
rust-version = "1.97"
license = "MIT/Apache-2.0"
repository = "https://github.com/arkworks-rs/poly-commit"
categories = ["cryptography"]
publish = false

[dependencies]
ark-poly-commit = { path = "..", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false, features = ["derive"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-poly = { version = "0.6.0", default-features = false }
ark-crypto-primitives = { version = "0.6.0", default-features = false, features = ["sponge", "merkle_tree"] }
ark-std = { version = "0.6.0", default-features = false }
rand_chacha = { version = "0.3.0", default-features = false }
criterion = { version = "0.5", default-features = false }
paste = "1.0"
