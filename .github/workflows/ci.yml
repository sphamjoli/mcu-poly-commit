name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Workspace, all targets, all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace, default features
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace, without std
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: std
            features: --all-features
          - mode: no_std
            features: --no-default-features
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.mode }}
      - name: Unit and doc tests
        run: cargo test --workspace ${{ matrix.features }} --locked

  bench:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build benchmarks
        run: cargo bench -p ark-pcs-bench-templates --features bench --locked --no-run

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy without std
        run: cargo clippy --locked --lib --no-default-features --target ${{ matrix.target }} -- -D warnings
      - name: Clippy without std, with r1cs
        run: cargo clippy --locked --lib --no-default-features --features r1cs --target ${{ matrix.target }} -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps --locked

  deny:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  ci:
    name: CI summary
    if: ${{ always() }}
    needs: [fmt, clippy, test, bench, no-std, docs, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| rustfmt | ${{ needs.fmt.result }} |"
            echo "| clippy | ${{ needs.clippy.result }} |"
            echo "| test (std, no_std) | ${{ needs.test.result }} |"
            echo "| benchmarks | ${{ needs.bench.result }} |"
            echo "| no_std | ${{ needs.no-std.result }} |"
            echo "| docs | ${{ needs.docs.result }} |"
            echo "| cargo-deny | ${{ needs.deny.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required check did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required checks failed." >&2
          exit 1
